<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>WardRounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --line:#DDE1E6; --ink:#1F2933; --muted:#616E7C;
  --accent:#2563EB; --accent-deep:#1D4ED8; --accent-soft:#EFF4FF;
  --fever:#C62828; --fever-soft:#FDECEC; --ok:#2E7D32; --ok-soft:#EAF5EA; --warn:#B26A00; --warn-soft:#FFF4E0;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;color:var(--accent)}
.logo svg{width:22px;height:22px}
.logo span{font-weight:600;font-size:17px;color:var(--ink);line-height:1.2}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.spacer{flex:1}
.day{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:6px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep)}
.btn.danger{color:var(--fever);border-color:var(--line)}
.btn.danger.solid{background:var(--fever);border-color:var(--fever);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.eyebrow{margin:0 0 2px;font-size:12px;color:var(--muted)}
.center{text-align:center}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px;max-width:70ch}
.tabs{display:flex;flex-wrap:wrap;gap:0;margin:0 0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.click{cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row.click:hover{background:var(--bg)}
.row.sel{background:var(--accent-soft)}
.room{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.who b{display:block;font-weight:600}
.who span{color:var(--muted);font-size:13px}
.err{grid-column:2/-1;color:var(--fever);font-size:13px}
.temp{font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.chip.fever{background:var(--fever-soft);color:var(--fever)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent-deep)}
.inl{display:flex;gap:6px;align-items:center}
.inl input{width:80px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.empty{padding:24px 12px;text-align:center;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel .room{display:inline}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.dchip{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;min-width:62px;color:var(--muted)}
.dchip b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.dchip.f b{color:var(--fever)} .dchip.n b{color:var(--ok)}
textarea{width:100%;min-height:80px;padding:8px;border:1px solid var(--line);border-radius:6px}
.note{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.alert,.okbox{padding:10px 14px;border-radius:6px;margin-bottom:16px;border:1px solid}
.alert{background:var(--fever-soft);color:var(--fever)}
.okbox{background:var(--ok-soft);color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px}
.bed{aspect-ratio:1;border:1px solid var(--line);border-radius:4px;font-size:12px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted)}
.bed.occ{background:var(--surface);color:var(--ink)}
.bed.fev{background:var(--fever-soft);color:var(--fever)}
.bed.elig{background:var(--ok-soft);color:var(--ok)}
.bed.req{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line);background:var(--sw,var(--bg))}
form.admit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
form.admit label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
form.admit input{padding:6px 8px;border:1px solid var(--line);border-radius:6px}
@media (max-width:520px){form.admit{grid-template-columns:1fr 1fr}form.admit .btn{grid-column:1/-1}}
.signin{max-width:440px;margin:56px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
.signin .logo{margin-bottom:16px}
.roles{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.role{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;text-align:left}
.role:hover{border-color:var(--accent);background:var(--accent-soft)}
.role .ico{color:var(--accent);display:flex}
.role .ico svg{width:20px;height:20px}
.role b{display:block;font-weight:600;color:var(--ink)}
.role span{display:block;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;z-index:20}
.sec{margin-top:24px}
</style>

</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const FEVER = 38.0, BEDS = 74, KEY = 'wardrounds-v1';
const START = Date.UTC(2026, 10, 12);
const ROLES = {
  nurse: {label: 'Nurse', who: 'Nurse Asha', desc: 'Record each patient’s daily temperature', icon: 'thermo'},
  doctor: {label: 'Doctor', who: 'Dr. Mehra', desc: 'Visit patients, record treatment, sign off discharges', icon: 'steth'},
  admin: {label: 'Admin staff', who: 'Ravi (Admin)', desc: 'Admit patients, assign rooms, complete discharges', icon: 'bed'},
  head: {label: 'Head doctor', who: 'Dr. Iyer (Head)', desc: 'Ward overview and treatment quality vs the 85% benchmark', icon: 'pulse'}
};

const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  steth: svg('<path d="M5 3v6a4 4 0 0 0 8 0V3"/><path d="M9 13v2a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="11" r="2"/>'),
  thermo: svg('<path d="M14 14.8V4.5a2.5 2.5 0 0 0-5 0v10.3a4.5 4.5 0 1 0 5 0z"/><path d="M11.5 9v7"/>'),
  bed: svg('<path d="M3 5v14"/><path d="M3 9h15a3 3 0 0 1 3 3v7"/><path d="M3 16h18"/><path d="M7 9v7"/>'),
  pulse: svg('<path d="M3 12h4l3-7 4 14 3-7h4"/>')
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seed() {
  const r = rng(7), pick = a => a[Math.floor(r() * a.length)];
  const first = ['Aarav','Priya','Rohan','Sneha','Vikram','Ananya','Kabir','Meera','Arjun','Isha','Farhan','Lakshmi','Neel','Pooja','Sameer','Divya','Karan','Nisha','Rahul','Zoya','Tara','Imran','Kavya','Manoj'];
  const last = ['Sharma','Patel','Iyer','Khan','Reddy','Nair','Das','Joshi','Gupta','Menon','Shetty','Bose','Rao','Kulkarni','Singh','Pillai'];
  const patients = [];
  for (let i = 1; i <= BEDS; i++) {
    const stay = 1 + Math.floor(r() * 11);          // days already in the ward
    const feverDays = Math.max(1, stay - Math.floor(r() * r() * 4));
    const p = {id: i, name: pick(first) + ' ' + pick(last), age: 18 + Math.floor(r() * 62), room: i, admit: -stay, temps: {}, visits: {}, disReq: false};
    for (let d = -stay; d < 0; d++) {
      const t = d - p.admit < feverDays ? 38.2 + r() * 1.8 : 36.4 + r() * 1.0;
      p.temps[d] = {t: Math.round(t * 10) / 10, by: 'Nurse Asha'};
      p.visits[d] = {note: 'Reviewed. Continue current treatment.', by: 'Dr. Mehra'};
    }
    patients.push(p);
  }
  // some of today's round already done
  patients.slice(0, 30).forEach((p, i) => {
    const prev = p.temps[-1].t;
    p.temps[0] = {t: Math.round((prev >= FEVER ? prev - r() * 0.6 : 36.5 + r() * 0.8) * 10) / 10, by: 'Nurse Asha', at: '08:' + String(10 + i).padStart(2, '0')};
    if (i < 12) p.visits[0] = {note: 'Reviewed. Continue current treatment.', by: 'Dr. Mehra'};
  });
  const archive = [];
  for (let i = 0; i < 47; i++) archive.push({outcome: i < 6 ? 'deceased' : 'discharged', los: 4 + Math.floor(r() * 10)});
  return {day: 0, nextId: BEDS + 1, patients, archive, role: null};
}
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
let S = load() || seed();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const ui = {nurse: 'pending', doctor: 'ready', sel: null, edit: null, confirm: null, err: {}, draft: {}};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = d => new Date(START + d * 864e5).toLocaleDateString('en-IN', {day: 'numeric', month: 'short', timeZone: 'UTC'});
const now = () => new Date().toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit', hour12: false});
const pts = () => S.patients;
const byId = id => pts().find(p => p.id == id);
const tToday = p => p.temps[S.day];
const visited = p => !!p.visits[S.day];
const fever = t => t >= FEVER;
// consecutive fever-free days, counting back from today (or yesterday if today's reading is not in yet)
function streak(p) {
  let d = p.temps[S.day] ? S.day : S.day - 1, n = 0;
  while (d >= p.admit && p.temps[d] && !fever(p.temps[d].t)) { n++; d--; }
  return n;
}
const eligible = p => streak(p) >= 3;
const missedYesterday = p => p.admit < S.day && !p.temps[S.day - 1];
function lastTemp(p) { for (let d = S.day; d >= p.admit; d--) if (p.temps[d]) return {d, ...p.temps[d]}; return null; }
const tChip = t => `<span class="chip ${fever(t) ? 'fever' : 'ok'} temp">${t.toFixed(1)} °C</span>`;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

function header() {
  const r = ROLES[S.role];
  return `<div class="top"><div class="in">
    <div class="logo">${ICON.steth}<span>WardRounds<small>${r.label} · ${esc(r.who)}</small></span></div>
    <span class="spacer"></span>
    <span class="day">Day ${S.day + 1} · ${fmt(S.day)}</span>
    <button class="btn sm" data-act="nextDay" title="Demo control: move the ward clock forward one day">Next day ▸</button>
    <button class="btn sm" data-act="reset">Reset demo</button>
    <button class="btn sm" data-act="logout">Switch user</button>
  </div></div>`;
}

function signin() {
  return `<div class="wrap"><div class="signin">
    <div class="logo">${ICON.steth}<span>WardRounds</span></div>
    <h1>Sign in</h1>
    <p class="note">Temperature and visit tracking for the quarantine ward (${BEDS} rooms). Each role is a demo account.</p>
    <div class="roles">${Object.entries(ROLES).map(([k, r]) => `<button class="role" data-act="login" data-id="${k}"><span class="ico">${ICON[r.icon]}</span><span><b>${r.label}</b><span>${r.desc}</span></span></button>`).join('')}</div>
  </div></div>`;
}

function nurse() {
  const all = pts().slice().sort((a, b) => a.room - b.room);
  const done = all.filter(tToday), pending = all.filter(p => !tToday(p));
  const list = {pending, done, all}[ui.nurse];
  const rows = list.map(p => {
    const t = tToday(p), last = lastTemp(p), editing = ui.edit == p.id;
    const meta = [`${p.age} y`, `day ${S.day - p.admit + 1} of stay`];
    if (last && last.d < S.day) meta.push(`last ${last.t.toFixed(1)} °C on ${fmt(last.d)}`);
    let right;
    if (!t || editing) right = `<form class="inl" data-act="recTemp" data-id="${p.id}" novalidate>
        <input id="t${p.id}" name="t" type="number" step="0.1" inputmode="decimal" placeholder="°C" value="${esc(ui.draft[p.id] ?? (editing ? t.t : ''))}" aria-label="Temperature for ${esc(p.name)}">
        <button class="btn primary sm">${editing ? 'Update' : 'Save'}</button></form>`;
    else right = `<div class="inl">${tChip(t.t)}<button class="btn sm" data-act="edit" data-id="${p.id}" ${visited(p) ? 'disabled title="Doctor has already visited; ask the doctor to correct it"' : ''}>Correct</button></div>`;
    return `<div class="row"><div class="room">R${String(p.room).padStart(2, '0')}</div>
      <div class="who"><b>${esc(p.name)} ${missedYesterday(p) ? '<span class="chip warn">Missed yesterday</span>' : ''}</b><span>${meta.join(' · ')}</span></div>
      ${right}${ui.err[p.id] ? `<div class="err">${esc(ui.err[p.id])}</div>` : ''}</div>`;
  }).join('');
  return `<div class="wrap">
    <p class="eyebrow">Nurse station</p><h1>Today's temperature round</h1>
    <p class="sub">${done.length} of ${all.length} patients measured on ${fmt(S.day)}. Each patient gets one reading per day; fever is ${FEVER.toFixed(1)} °C or higher.</p>
    <div class="bar" style="margin:-8px 0 16px"><i style="width:${done.length / Math.max(1, all.length) * 100}%"></i></div>
    <div class="tabs">${[['pending', `To measure (${pending.length})`], ['done', `Measured (${done.length})`], ['all', 'All patients']].map(([k, l]) => `<button class="tab" data-act="ntab" data-id="${k}" aria-pressed="${ui.nurse === k}">${l}</button>`).join('')}</div>
    <div class="list">${rows || '<div class="empty">Everyone on this list is done for today.</div>'}</div></div>`;
}

function doctor() {
  const all = pts().slice().sort((a, b) => a.room - b.room);
  const groups = {
    ready: all.filter(p => tToday(p) && !visited(p)),
    waiting: all.filter(p => !tToday(p) && !visited(p)),
    visited: all.filter(visited),
    discharge: all.filter(p => eligible(p))
  };
  const labels = {ready: 'Ready for visit', waiting: 'Waiting for temperature', visited: 'Visited today', discharge: 'Fever-free 3+ days'};
  const list = groups[ui.doctor];
  const rows = list.map(p => {
    const t = tToday(p), st = streak(p);
    let chip = t ? tChip(t.t) : '<span class="chip warn">No reading yet</span>';
    if (p.disReq) chip = '<span class="chip acc">Sent to admin</span>';
    else if (eligible(p)) chip = '<span class="chip ok">Can be discharged</span>';
    return `<button class="row click ${ui.sel == p.id ? 'sel' : ''}" data-act="sel" data-id="${p.id}">
      <div class="room">R${String(p.room).padStart(2, '0')}</div>
      <div class="who"><b>${esc(p.name)}</b><span>${p.age} y · ${st} fever-free day${st === 1 ? '' : 's'}</span></div>${chip}</button>`;
  }).join('');
  return `<div class="wrap">
    <p class="eyebrow">Doctor</p><h1>Doctor's rounds</h1>
    <p class="sub">${groups.visited.length} of ${all.length} patients visited today. Patients appear under "Ready for visit" once the nurse has recorded today's temperature.</p>
    <div class="tabs">${Object.keys(groups).map(k => `<button class="tab" data-act="dtab" data-id="${k}" aria-pressed="${ui.doctor === k}">${labels[k]} (${groups[k].length})</button>`).join('')}</div>
    <div class="cols"><div class="list">${rows || '<div class="empty">No patients in this list.</div>'}</div>
    <div>${ui.sel && byId(ui.sel) ? detail(byId(ui.sel)) : '<div class="panel note">Select a patient to see their temperature history and record today’s visit.</div>'}</div></div></div>`;
}

function detail(p) {
  const t = tToday(p), st = streak(p), from = Math.max(p.admit, S.day - 9);
  let days = '';
  for (let d = from; d <= S.day; d++) {
    const r = p.temps[d];
    days += `<div class="dchip ${r ? (fever(r.t) ? 'f' : 'n') : ''}">${fmt(d)}<b>${r ? r.t.toFixed(1) : '—'}</b></div>`;
  }
  const v = p.visits[S.day];
  let visit;
  if (v) visit = `<p class="note">Visited today by ${esc(v.by)}${v.at ? ' at ' + v.at : ''}: ${esc(v.note)}</p>`;
  else if (!t) visit = `<p class="chip warn">Visit locked until the nurse records today’s temperature.</p>`;
  else visit = `<form class="stack" data-act="visit" data-id="${p.id}" novalidate>
      <label class="note" for="note${p.id}">Assessment and treatment for today</label>
      <textarea id="note${p.id}" name="note" placeholder="e.g. Paracetamol 650 mg every 6 h, oral fluids">${esc(ui.draft['n' + p.id] || '')}</textarea>
      ${ui.err['n' + p.id] ? `<div class="note" style="color:var(--fever)">${esc(ui.err['n' + p.id])}</div>` : ''}
      <div><button class="btn primary">Complete visit</button></div></form>`;
  const dis = p.disReq ? '<span class="chip acc">Discharge sent to admin</span>'
    : `<button class="btn" data-act="reqDis" data-id="${p.id}" ${eligible(p) ? '' : `disabled title="Needs 3 consecutive fever-free days (now ${st})"`}>Send discharge to admin</button>`;
  const death = ui.confirm == p.id
    ? `<span class="note">Record ${esc(p.name)} as deceased? This closes the case and frees room ${p.room}.</span>
       <button class="btn danger solid" data-act="death" data-id="${p.id}">Yes, record death</button><button class="btn" data-act="cancel">Cancel</button>`
    : `<button class="btn danger" data-act="askDeath" data-id="${p.id}">Record death</button>`;
  return `<div class="panel">
    <h2>${esc(p.name)} <span class="room">· Room ${p.room}</span></h2>
    <p class="note">${p.age} y · admitted ${fmt(p.admit)} (day ${S.day - p.admit + 1}) · today ${t ? tChip(t.t) : '<span class="chip warn">not measured</span>'}</p>
    <div class="days">${days}</div>
    <p class="note">Fever-free streak: <b>${st} of 3 days</b>${eligible(p) ? '. Meets the discharge rule.' : ''}</p>
    ${visit}
    <div class="actions sec">${dis}</div>
    <div class="actions" style="margin-top:10px;align-items:center">${death}</div></div>`;
}

function admin() {
  const occ = pts().length, free = BEDS - occ;
  const req = pts().filter(p => p.disReq), elig = pts().filter(p => eligible(p) && !p.disReq);
  const rooms = new Map(pts().map(p => [p.room, p]));
  let grid = '';
  for (let r = 1; r <= BEDS; r++) {
    const p = rooms.get(r), t = p && tToday(p);
    const cls = !p ? '' : p.disReq ? 'occ req' : eligible(p) ? 'occ elig' : t && fever(t.t) ? 'occ fev' : 'occ';
    grid += `<div class="bed ${cls}" title="${p ? esc(p.name) : 'Free'}">${r}</div>`;
  }
  return `<div class="wrap">
    <p class="eyebrow">Admin desk</p><h1>Admissions and discharges</h1>
    <p class="sub">${occ} of ${BEDS} rooms occupied · ${free} free.</p>
    <div class="panel"><h2>Admit a patient</h2>
      ${free ? `<form class="admit" data-act="admit" novalidate>
        <label>Full name<input id="aname" name="name" autocomplete="off" value="${esc(ui.draft.aname || '')}"></label>
        <label>Age<input id="aage" name="age" type="number" inputmode="numeric" value="${esc(ui.draft.aage || '')}"></label>
        <button class="btn primary">Admit to room ${firstFree()}</button></form>
        ${ui.err.admit ? `<p class="note" style="color:var(--fever)">${esc(ui.err.admit)}</p>` : ''}`
      : '<p class="chip warn">Ward is full. New admissions open as soon as a patient is discharged.</p>'}
    </div>
    <div class="sec"><h2>Ready to discharge (${req.length})</h2>
      <div class="list">${req.map(p => `<div class="row"><div class="room">R${String(p.room).padStart(2, '0')}</div>
        <div class="who"><b>${esc(p.name)}</b><span>Signed off by doctor · ${streak(p)} fever-free days · stay ${S.day - p.admit + 1} days</span></div>
        <button class="btn primary sm" data-act="discharge" data-id="${p.id}">Complete discharge</button></div>`).join('') || '<div class="empty">No discharges waiting.</div>'}</div>
      ${elig.length ? `<p class="note">${elig.length} more patient${elig.length > 1 ? 's meet' : ' meets'} the 3-day rule and ${elig.length > 1 ? 'are' : 'is'} waiting for doctor sign-off: ${elig.map(p => 'R' + p.room).join(', ')}.</p>` : ''}
    </div>
    <div class="sec"><h2>Rooms</h2><div class="panel"><div class="grid">${grid}</div>
      <div class="legend"><span style="--sw:var(--bg)">Free</span><span style="--sw:var(--surface)">Occupied</span><span style="--sw:var(--fever-soft)">Fever today</span><span style="--sw:var(--ok-soft)">Meets discharge rule</span><span style="--sw:var(--accent)">Discharge sent</span></div></div></div>
  </div>`;
}
function firstFree() { const used = new Set(pts().map(p => p.room)); for (let r = 1; r <= BEDS; r++) if (!used.has(r)) return r; return null; }

function head() {
  const n = pts().length, temps = pts().filter(tToday).length, visits = pts().filter(visited).length;
  const dead = S.archive.filter(a => a.outcome === 'deceased').length, closed = S.archive.length;
  const mort = closed ? dead / closed * 100 : 0;
  const los = closed ? S.archive.filter(a => a.outcome === 'discharged').reduce((s, a) => s + a.los, 0) / Math.max(1, closed - dead) : 0;
  const missed = pts().filter(missedYesterday), stuck = pts().filter(p => eligible(p) && !p.disReq), waitAdmin = pts().filter(p => p.disReq);
  const kpi = (l, v, s, pct) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div>${pct != null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}</div>`;
  const att = (title, arr, why) => `<div class="row"><div class="room">${arr.length}</div><div class="who"><b>${title}</b><span>${arr.length ? arr.slice(0, 12).map(p => 'R' + p.room).join(', ') + (arr.length > 12 ? ' …' : '') : 'None'}</span></div><span class="note">${why}</span></div>`;
  return `<div class="wrap">
    <p class="eyebrow">Head doctor</p><h1>Ward overview</h1>
    <p class="sub">${fmt(S.day)} · outcomes counted over all closed cases (discharged + deceased).</p>
    ${mort > 15 ? `<div class="alert">Mortality is ${mort.toFixed(1)}%, above the expected 15%. Review recent deaths and treatment protocols.</div>`
      : `<div class="okbox">Mortality is ${mort.toFixed(1)}%, within the expected 15% (success rate ${(100 - mort).toFixed(1)}% vs 85% benchmark).</div>`}
    <div class="kpis">
      ${kpi('Occupancy', `${n}/${BEDS}`, `${BEDS - n} rooms free`, n / BEDS * 100)}
      ${kpi('Temperatures today', `${temps}/${n}`, `${n - temps} still to measure`, temps / Math.max(1, n) * 100)}
      ${kpi('Doctor visits today', `${visits}/${n}`, `${n - visits} still to visit`, visits / Math.max(1, n) * 100)}
      ${kpi('Success rate', `${(100 - mort).toFixed(1)}%`, `${closed - dead} cured · ${dead} deceased · benchmark 85%`)}
      ${kpi('Average stay', `${los.toFixed(1)} d`, 'admission to discharge')}
    </div>
    <h2>Needs attention</h2>
    <div class="list">
      ${att('Missed yesterday’s temperature', missed, 'Nurse round gap')}
      ${att('Fever-free 3+ days, not signed off', stuck, 'Doctor to send discharge')}
      ${att('Signed off, not yet discharged', waitAdmin, 'Admin to complete')}
    </div></div>`;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = !S.role ? signin() : header() + {nurse, doctor, admin, head}[S.role]();
}

const act = {
  login: id => { S.role = id; save(); render(); },
  logout: () => { S.role = null; ui.sel = null; save(); render(); },
  nextDay: () => { S.day++; ui.sel = ui.edit = ui.confirm = null; ui.err = {}; save(); render(); toast('Moved to ' + fmt(S.day)); },
  reset: () => { const r = S.role; S = seed(); S.role = r; ui.sel = null; save(); render(); toast('Demo data reset'); },
  ntab: id => { ui.nurse = id; render(); },
  dtab: id => { ui.doctor = id; ui.sel = null; render(); },
  edit: id => { ui.edit = id; render(); document.getElementById('t' + id)?.focus(); },
  recTemp: (id, f) => {
    const raw = f.t.value.trim(), v = parseFloat(raw), p = byId(id);
    ui.draft[id] = raw;
    if (!raw) ui.err[id] = 'Enter the temperature in °C.';
    else if (isNaN(v) || v < 34 || v > 43) ui.err[id] = 'Check the reading: it must be between 34.0 and 43.0 °C.';
    else {
      const corrected = !!tToday(p);
      p.temps[S.day] = {t: Math.round(v * 10) / 10, by: ROLES.nurse.who, at: now()};
      delete ui.err[id]; delete ui.draft[id]; ui.edit = null; save();
      toast(`${corrected ? 'Updated' : 'Saved'} ${v.toFixed(1)} °C for ${p.name}${fever(v) ? ' (fever)' : ''}`);
    }
    render();
    if (ui.err[id]) document.getElementById('t' + id)?.focus();
  },
  sel: id => { ui.sel = id; ui.confirm = null; render(); },
  visit: (id, f) => {
    const note = f.note.value.trim(), p = byId(id);
    ui.draft['n' + id] = note;
    if (note.length < 3) ui.err['n' + id] = 'Add a short note on the assessment or treatment.';
    else if (!tToday(p)) ui.err['n' + id] = 'Today’s temperature is missing.';
    else { p.visits[S.day] = {note, by: ROLES.doctor.who, at: now()}; delete ui.err['n' + id]; delete ui.draft['n' + id]; save(); toast('Visit recorded for ' + p.name); }
    render();
  },
  reqDis: id => { const p = byId(id); if (!eligible(p)) return; p.disReq = true; save(); render(); toast('Discharge sent to admin for ' + p.name); },
  askDeath: id => { ui.confirm = id; render(); },
  cancel: () => { ui.confirm = null; render(); },
  death: id => { close(id, 'deceased'); ui.sel = null; ui.confirm = null; render(); toast('Death recorded, case closed'); },
  discharge: id => { const p = byId(id); close(id, 'discharged'); render(); toast(`${p.name} discharged · room ${p.room} is free`); },
  admit: (_, f) => {
    const name = f.name.value.trim(), age = parseInt(f.age.value, 10);
    ui.draft.aname = name; ui.draft.aage = f.age.value;
    const room = firstFree();
    if (!room) ui.err.admit = 'Ward is full.';
    else if (name.length < 2) ui.err.admit = 'Enter the patient’s full name.';
    else if (!(age >= 0 && age <= 120)) ui.err.admit = 'Enter an age between 0 and 120.';
    else {
      S.patients.push({id: S.nextId++, name, age, room, admit: S.day, temps: {}, visits: {}, disReq: false});
      ui.err.admit = null; ui.draft.aname = ui.draft.aage = ''; save(); toast(`${name} admitted to room ${room}`);
    }
    render();
  }
};
function close(id, outcome) {
  const p = byId(id);
  S.archive.push({outcome, los: S.day - p.admit + 1});
  S.patients = S.patients.filter(x => x.id != id);
  save();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (b && !b.disabled) act[b.dataset.act](b.dataset.id, b);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-act]');
  if (f) { e.preventDefault(); act[f.dataset.act](f.dataset.id, f); }
});
render();
</script>

</body>
</html>
